name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with pytest
        env:
          # Valores dummy seguros: los tests usan mocks, no un MongoDB real
          MONGODB_URL: mongodb://localhost:27017
          MONGODB_DB_NAME: pdf_extractor_test
        run: pytest -v
